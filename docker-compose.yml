services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_PATH: /data/karaoke.db
    volumes:
      - karaoke-data:/data
    expose:
      - "3000"

  # Cópia consistente do banco 1x por dia (mantém as 30 mais recentes).
  backup:
    build: .
    restart: unless-stopped
    command: ["sh", "-c", "while true; do node --disable-warning=ExperimentalWarning scripts/backup.mjs; sleep 86400; done"]
    environment:
      DATABASE_PATH: /data/karaoke.db
      BACKUP_DIR: /backups
      BACKUP_KEEP: "30"
    volumes:
      - karaoke-data:/data
      - karaoke-backups:/backups

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ADMIN_USER: ${ADMIN_USER:?defina ADMIN_USER no .env}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?defina ADMIN_PASSWORD_HASH no .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  karaoke-data:
  karaoke-backups:
  caddy-data:
  caddy-config:
